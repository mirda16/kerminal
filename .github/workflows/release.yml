name: Release Kerminal App

on:
  push:
    tags:
      - "v*"

jobs:
  build-tauri:
    permissions:
      contents: write
    name: Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm-based Macs (M1 and above).
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel-based Macs.
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-latest"
            args: ""
            target: ""
          - platform: "windows-latest"
            args: ""
            target: ""

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6d9817901c499d6b02debbb57edb38d33daa680b
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          workspaces: "./src-tauri -> target"
          shared-key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install --ignore-scripts

      - name: Build and release
        uses: tauri-apps/tauri-action@51a9f1156b33df106d827c3a78f8f894946c5faa
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Kerminal v__VERSION__"
          releaseBody: "New release of Kerminal App"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}


      # Fix AppImage for Wayland compatibility by removing bundled EGL/OpenGL libraries
      # that conflict with system libraries and cause EGL_BAD_PARAMETER errors
      - name: Post-process AppImage for Wayland compatibility
        if: matrix.platform == 'ubuntu-latest'
        env:
          # Run appimagetool without FUSE
          APPIMAGE_EXTRACT_AND_RUN: 1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Find the built AppImage
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" -type f | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found, skipping post-processing"
            exit 0
          fi

          echo "Processing: $APPIMAGE"

          # Make it executable and extract
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract > /dev/null

          # Remove conflicting EGL/OpenGL libraries that cause issues on Wayland
          echo "Removing conflicting EGL/OpenGL libraries..."
          rm -f squashfs-root/usr/lib/libEGL.so* squashfs-root/usr/lib/libEGL_mesa.so*
          rm -f squashfs-root/usr/lib/libGL.so* squashfs-root/usr/lib/libGLX.so* squashfs-root/usr/lib/libGLX_mesa.so* squashfs-root/usr/lib/libGLdispatch.so*
          rm -f squashfs-root/usr/lib/libwayland-client.so* squashfs-root/usr/lib/libwayland-egl.so* squashfs-root/usr/lib/libwayland-cursor.so*
          rm -f squashfs-root/usr/lib/libdrm.so* squashfs-root/usr/lib/libgbm.so*

          # Repack AppImage using appimagetool
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

          # Remove old AppImage and create new one
          rm "$APPIMAGE"
          ARCH=x86_64 ./appimagetool squashfs-root "$APPIMAGE"

          # Clean up
          rm -rf squashfs-root appimagetool

          # The repacked file differs from the one tauri-action signed, so sign it again
          rm -f "$APPIMAGE.sig"
          npx tauri signer sign "$APPIMAGE"

          echo "AppImage post-processing complete: $APPIMAGE"

      - name: Upload fixed AppImage
        if: matrix.platform == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" -type f | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found, skipping upload"
            exit 0
          fi

          TAG_NAME="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG_NAME" "$APPIMAGE" "$APPIMAGE.sig" --clobber
          echo "Fixed AppImage uploaded successfully"

  # Runs after all builds so that no other job is rewriting latest.json at the same time
  fix-updater-manifest:
    permissions:
      contents: write
    name: Update AppImage signature in latest.json
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Replace AppImage signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          mkdir assets && cd assets
          gh release download "$TAG_NAME" --pattern "latest.json" --pattern "*.AppImage.sig"

          SIG_FILE=$(ls *.AppImage.sig | head -1)
          APPIMAGE_NAME="${SIG_FILE%.sig}"
          SIGNATURE=$(cat "$SIG_FILE")

          # Update every platform entry that points to the AppImage
          jq --arg name "$APPIMAGE_NAME" --arg sig "$SIGNATURE" \
            '.platforms |= with_entries(if (.value.url | endswith("/" + $name)) then .value.signature = $sig else . end)' \
            latest.json > latest.fixed.json
          mv latest.fixed.json latest.json

          gh release upload "$TAG_NAME" latest.json --clobber
          echo "latest.json updated for $APPIMAGE_NAME"
